name: Feature / Task
description: New feature or development task
title: "[FE/BE/OPS] "
labels: []
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Backend, DevOps, UI/UX]
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [Phase 1, Phase 2, Phase 3, Phase 4, Phase 5]
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: What is this issue about? Why does it exist?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: "List each criterion as a checkbox: - [ ] criterion"
    validations:
      required: true

  - type: textarea
    id: blocked_by
    attributes:
      label: Blocked By
      description: List issue numbers that must be completed before this one (e.g. #3, #5)

  - type: textarea
    id: blocks
    attributes:
      label: Blocks
      description: List issue numbers that cannot start until this is done
