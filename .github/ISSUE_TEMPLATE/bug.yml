name: Bug Report
description: Something is broken or behaving unexpectedly
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to...\n2. Click...\n3. See error"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device / viewport
      options: [Mobile (375px), Tablet (768px), Desktop (1440px), All]

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recordings
